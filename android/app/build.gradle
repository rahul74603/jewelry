apply plugin: 'com.android.application'

// Optional suffix for the master app build (-PaurumAppIdSuffix=.master):
// the master APK then gets its own package (com.aurum.jewellery.master),
// so it installs side-by-side with the customer app on one phone.
// Without the property the customer package is unchanged.
def aurumAppIdSuffix = project.findProperty("aurumAppIdSuffix") ?: ""

// Version, from the CI workflow (-PaurumVersionCode=<run number>
// -PaurumVersionName=1.0.<run number>). Safe defaults keep local
// builds working without the properties.
def aurumVersionCode = (project.findProperty("aurumVersionCode") ?: "1").toInteger()
def aurumVersionName = project.findProperty("aurumVersionName") ?: "1.0"

android {
    namespace "com.aurum.jewellery"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aurum.jewellery" + aurumAppIdSuffix
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode aurumVersionCode
        versionName aurumVersionName
        // App label shows the version (e.g. "Aurum 1.0.32",
        // "Aurum Master 1.0.32") so the shopkeeper can see on the
        // phone which build is installed. A resValue overrides
        // strings.xml at build time, survives `npx cap sync`, and
        // makes the master label independent of any workflow edit.
        resValue "string", "app_name", aurumAppIdSuffix == ".master" ? "Aurum Master ${aurumVersionName}" : "Aurum ${aurumVersionName}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        // No versionNameSuffix: the native versionName must match the
        // web version (VITE_APP_VERSION) exactly, so the label and the
        // Settings line show the same number.
        debug { applicationIdSuffix ".preview" }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // MediSmart-style ABI splits: one APK per phone ABI, no universal APK.
    // arm64-v8a = latest phones, armeabi-v7a = older/medium phones,
    // x86_64 = built only (emulator + split parity) and never published.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.9.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
