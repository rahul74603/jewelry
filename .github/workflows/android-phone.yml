name: Android phone preview

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "public/**"
      - "functions/src/core/**"
      - "android/**"
      - "tests/android/**"
      - "package*.json"
      - "index.html"
      - "*.config.*"
      - ".github/workflows/android-phone.yml"

# Never give untrusted pull-request builds a release token.
permissions:
  contents: read

jobs:
  apk:
    name: Build installable demo APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_APP_MODE: demo
      VITE_LICENSE_SERVER_URL: ${{ secrets.VITE_LICENSE_SERVER_URL }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Check hosted Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - run: npx --no-install cap sync android
      - name: Package split debug APKs (arm64 + armeabi + x86_64)
        working-directory: android
        run: ./gradlew --no-daemon -PaurumVersionCode=${{ github.run_number }} -PaurumVersionName=1.0.${{ github.run_number }} :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare split APKs (arm64 + armeabi publish, x86_64 emulator only)
        run: |
          mkdir -p phone
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk phone/Aurum-Customer-arm64.apk
          cp android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk phone/Aurum-Customer-armeabi.apk
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk phone/Aurum-Customer-x86_64.apk
          for apk in phone/Aurum-Customer-arm64.apk phone/Aurum-Customer-armeabi.apk phone/Aurum-Customer-x86_64.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"; done
          cd phone && sha256sum Aurum-Customer-arm64.apk Aurum-Customer-armeabi.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-phone-preview
          path: phone/
          if-no-files-found: error
          retention-days: 14

  master:
    name: Build installable master APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_APP_MODE: master
      VITE_LICENSE_SERVER_URL: ${{ secrets.VITE_LICENSE_SERVER_URL }}
      VITE_LICENSE_ADMIN_TOKEN: ${{ secrets.VITE_LICENSE_ADMIN_TOKEN }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Check hosted Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - run: npx --no-install cap sync android
      - name: Brand the master app (own package + label)
        run: |
          sed -i 's|Aurum Workspace|Aurum Master 1.0.${{ github.run_number }}|g' android/app/src/main/res/values/strings.xml
          grep app_name android/app/src/main/res/values/strings.xml
      - name: Package split debug APKs (arm64 + armeabi + x86_64)
        working-directory: android
        run: ./gradlew --no-daemon -PaurumAppIdSuffix=.master -PaurumVersionCode=${{ github.run_number }} -PaurumVersionName=1.0.${{ github.run_number }} :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare master APK (arm64 only — developer has the latest phone)
        run: |
          mkdir -p master
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk master/Aurum-Master-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose master/Aurum-Master-arm64.apk
          cd master && sha256sum Aurum-Master-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-master
          path: master/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish direct phone download
    needs: [apk, master]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aurum-phone-preview, path: phone }
      - uses: actions/download-artifact@v4
        with: { name: aurum-master, path: master }
      - name: Create prerelease and tappable APK link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          TAG: phone-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cat phone/SHA256SUMS.txt master/SHA256SUMS.txt > SHA256SUMS.txt
          gh release create "$TAG" phone/Aurum-Customer-arm64.apk phone/Aurum-Customer-armeabi.apk master/Aurum-Master-arm64.apk SHA256SUMS.txt \
            --repo "$REPO" --target "$SHA" --prerelease \
            --title "Aurum · Android phone preview #$GITHUB_RUN_NUMBER" \
            --notes 'Phone test only. User app: Aurum-Customer-arm64.apk (latest phones) or Aurum-Customer-armeabi.apk (older/medium phones). Master app (developer only, one APK): Aurum-Master-arm64.apk. The x86_64 split is built for the emulator test only and is not published. Sample data resets on reload. No production account or signing secret is included. Each hosted runner uses a disposable debug signing key; uninstall the previous preview if Android rejects an update.'
          {
            echo '## Your phone builds are ready'
            echo "**[⬇ Download user APK (latest phones, arm64)]($SERVER/$REPO/releases/download/$TAG/Aurum-Customer-arm64.apk)**"
            echo "**[⬇ Download user APK (older phones, armeabi)]($SERVER/$REPO/releases/download/$TAG/Aurum-Customer-armeabi.apk)**"
            echo "**[⬇ Download master APK (latest phones, arm64)]($SERVER/$REPO/releases/download/$TAG/Aurum-Master-arm64.apk)**"
            echo ''
            echo 'फोन पर लिंक टैप करें → डाउनलोड हुई APK खोलें → Android की अनुमति देखकर Install दबाएँ।'
            echo ''
            echo 'Demo only. A workflow cannot silently download, install or launch an app on your phone.'
          } >> "$GITHUB_STEP_SUMMARY"

  device:
    name: Android system Back and print dialog (API 35)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: aurum-phone-preview, path: phone }
      - run: npm ci
      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/android/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-print-dialogs, path: test-results/phone/, retention-days: 14 }
