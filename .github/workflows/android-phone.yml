name: Android phone preview

# Single shared signing key + staged rollout (v1.0.50, Ajay 2026-11-26):
#  - apk/master jobs build UNSIGNED release APKs (no signing config in
#    build.gradle, no keystore in CI secrets). Unsigned APKs are NEVER
#    published as release assets.
#  - sign job: ONE shared key signs every Customer APK and the Master
#    APK. The shared key is the keystore of Ajay's own phone
#    (1f6aa766edbf — the key that signed the 1.0.48/1.0.49 Customer
#    APKs), fetched from the Worker (GET /admin/keystores/1f6aa766edbf,
#    admin token). It is NEVER generated fresh and NEVER replaced by
#    another key (e.g. the local aurum-release.p12): changing it would
#    force every shop to uninstall and reinstall. If the fetch fails,
#    the job fails loudly. Every signed APK is verified against the
#    keystore's certificate fingerprint. The device list (GET
#    /licenses, emulator rows skipped) is still fetched here so the
#    publish job can register an update record per device. An EMPTY
#    list does NOT fail the build: the release ships anyway (one
#    shared APK for all — shops install from the release link) and
#    update records are registered by the next build once phones
#    check in again (e.g. right after a server wipe, before any
#    phone has heartbeated).
#  - publish job: releases ONE Customer APK pair for all shops plus
#    the Master APK, then registers one update record per device
#    (POST /admin/updates/:id, allowed=false) all pointing at the
#    same Customer URLs, so no update goes out until Ajay enables it.
#  - device job: the emulator cannot install an unsigned APK, so it
#    signs the x86_64 split with a throwaway key that lives only on
#    that runner and is never published.
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "public/**"
      - "functions/src/core/**"
      - "android/**"
      - "tests/android/**"
      - "package*.json"
      - "index.html"
      - "*.config.*"
      - ".github/workflows/android-phone.yml"

# Never give untrusted pull-request builds a release token.
permissions:
  contents: read

jobs:
  apk:
    name: Build installable demo APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_APP_MODE: demo
      VITE_LICENSE_SERVER_URL: ${{ secrets.VITE_LICENSE_SERVER_URL }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Check hosted Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - run: npx --no-install cap sync android
      - name: Package split release APKs (arm64 + armeabi + x86_64)
        working-directory: android
        run: ./gradlew --no-daemon -PaurumVersionCode=${{ github.run_number }} -PaurumVersionName=1.0.${{ github.run_number }} :app:testDebugUnitTest :app:assembleRelease
      - name: Prepare split APKs (arm64 + armeabi publish, x86_64 emulator only)
        run: |
          # UNSIGNED by design: the sign job signs each APK with the shared key
          # and verifies it there. apksigner verify would fail on an
          # unsigned APK, so only the zip integrity is checked here.
          mkdir -p phone
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk phone/Aurum-Customer-arm64.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk phone/Aurum-Customer-armeabi.apk
          cp android/app/build/outputs/apk/release/app-x86_64-release-unsigned.apk phone/Aurum-Customer-x86_64.apk
          for apk in phone/Aurum-Customer-arm64.apk phone/Aurum-Customer-armeabi.apk phone/Aurum-Customer-x86_64.apk; do unzip -t -q "$apk"; done
          cd phone && sha256sum Aurum-Customer-arm64.apk Aurum-Customer-armeabi.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-phone-preview
          path: phone/
          if-no-files-found: error
          retention-days: 14

  master:
    name: Build installable master APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_APP_MODE: master
      VITE_LICENSE_SERVER_URL: ${{ secrets.VITE_LICENSE_SERVER_URL }}
      VITE_LICENSE_ADMIN_TOKEN: ${{ secrets.VITE_LICENSE_ADMIN_TOKEN }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Check hosted Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run build
      - run: npx --no-install cap sync android
      - name: Brand the master app (own package + label)
        run: |
          sed -i 's|Aurum Workspace|Aurum Master 1.0.${{ github.run_number }}|g' android/app/src/main/res/values/strings.xml
          grep app_name android/app/src/main/res/values/strings.xml
      - name: Package split release APKs (arm64 + armeabi + x86_64)
        working-directory: android
        run: ./gradlew --no-daemon -PaurumAppIdSuffix=.master -PaurumVersionCode=${{ github.run_number }} -PaurumVersionName=1.0.${{ github.run_number }} :app:testDebugUnitTest :app:assembleRelease
      - name: Prepare master APK (arm64 only — developer has the latest phone)
        run: |
          # UNSIGNED by design — see the apk job; the sign job signs it
          # with the shared key and verifies it there.
          mkdir -p master
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk master/Aurum-Master-arm64.apk
          unzip -t -q master/Aurum-Master-arm64.apk
          cd master && sha256sum Aurum-Master-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-master
          path: master/
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign APKs with the shared key
    needs: [apk, master]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LICENSE_SERVER: https://aurum-license-server.gahrwala.workers.dev
      # THE shared signing key (single key for all shops, since
      # v1.0.50, Ajay 2026-11-26): the keystore of Ajay's own phone
      # (1F6A-A766-EDBF, wire format) — the key that signed the
      # 1.0.48/1.0.49 Customer APKs. Every Customer APK and the Master
      # APK are signed with this one key, so any shop updates one-tap
      # forever with no reinstall. NEVER change this id, NEVER generate
      # a fresh key, and NEVER use the local aurum-release.p12 (a
      # different key): a different key would force every shop to
      # uninstall and reinstall. If the Worker has no keystore for
      # this id, the job fails loudly below.
      SHARED_DEVICE_ID: 1f6aa766edbf
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aurum-phone-preview, path: unsigned-phone }
      - uses: actions/download-artifact@v4
        with: { name: aurum-master, path: unsigned-master }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Check hosted Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Sign Customer + Master APKs with the shared key
        env:
          ADMIN_TOKEN: ${{ secrets.VITE_LICENSE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          WORK="$RUNNER_TEMP/shared-signing"
          mkdir -p "$WORK" signed
          echo "Fetching the device list from $LICENSE_SERVER/licenses ..."
          LICENSES_JSON="$(curl -fsSL -H "Authorization: Bearer $ADMIN_TOKEN" "$LICENSE_SERVER/licenses")"
          DEVICES="$(printf '%s' "$LICENSES_JSON" | python3 -c 'import json,re,sys
          d=json.load(sys.stdin)
          rows=d.get("licenses")
          if not isinstance(rows,list):
              raise SystemExit("ERROR: GET /licenses did not return a {\"licenses\": [...]} object")
          seen=[]
          for r in rows:
              dev=r.get("deviceId") if isinstance(r,dict) else None
              if not isinstance(dev,str) or not re.fullmatch(r"[0-9a-f]{12}",dev.strip().lower()):
                  raise SystemExit("ERROR: GET /licenses returned a bad deviceId: %r" % (dev,))
              dev=dev.strip().lower()
              model=r.get("model") if isinstance(r,dict) else ""
              if isinstance(model,str) and (model.strip().lower().startswith("sdk_") or "emulator" in model.strip().lower()):
                  print("Skipping emulator device %s (model %r) - it is a CI test phone, not a shop." % (dev, model), file=sys.stderr)
                  continue
              if dev not in seen:
                  seen.append(dev)
          if not seen:
              print("WARNING: GET /licenses returned an empty device list - no phone has heartbeated since the wipe. Shipping the release anyway; update records will be registered by the next build once phones check in.", file=sys.stderr)
          print("\n".join(seen))')"
          echo "Devices to register updates for:"
          printf '%s\n' "$DEVICES"
          printf '%s\n' "$DEVICES" > "$WORK/devices.txt"
          # Fingerprint check: keytool prints the SHA-256 fingerprint
          # UPPERCASE with colons, apksigner --print-certs prints it
          # lowercase (and spacing differs between tool versions), so
          # a fixed-string grep fails even when the signature is
          # correct (runs #46/#47). Compare the bare hex instead —
          # no colons, no whitespace, lowercase — and print BOTH
          # values on failure so the next diagnosis is not blind.
          verify_fp() {
            local actual actual_norm expected_norm
            actual="$( "$APKSIGNER" verify --print-certs "$1" | awk -F'SHA-256 digest: ' '/SHA-256 digest:/ {print $2; exit}' )"
            actual_norm="$(printf '%s' "$actual" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
            expected_norm="$(printf '%s' "$2" | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
            [ -n "$actual_norm" ] && [ "$actual_norm" = "$expected_norm" ] || { echo "ERROR: $1 is NOT signed with $3 (expected SHA-256 $2, got ${actual:-<none>})"; return 1; }
          }
          # THE shared key: the keystore of device 1f6aa766edbf (Ajay's
          # phone) — the key that signed the 1.0.48/1.0.49 Customer
          # APKs. Fetch it and fail loudly on anything but HTTP 200.
          # NEVER generate a fresh key and NEVER fall back to another
          # key: any other key would force every shop to uninstall
          # and reinstall, defeating the single-key design.
          KS="$WORK/shared.p12"
          KS_JSON="$WORK/shared.json"
          HTTP_CODE="$(curl -sS -o "$KS_JSON" -w '%{http_code}' -H "Authorization: Bearer $ADMIN_TOKEN" "$LICENSE_SERVER/admin/keystores/$SHARED_DEVICE_ID")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: GET /admin/keystores/$SHARED_DEVICE_ID returned HTTP $HTTP_CODE - the shared signing key could not be fetched. Refusing to sign with any other key."
            exit 1
          fi
          KS_ALIAS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("alias") or "")' "$KS_JSON")"
          KS_PASS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("password") or "")' "$KS_JSON")"
          KS_B64="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("keystoreB64") or "")' "$KS_JSON")"
          test -n "$KS_ALIAS" && test -n "$KS_PASS" && test -n "$KS_B64" || { echo "ERROR: /admin/keystores/$SHARED_DEVICE_ID returned an incomplete keystore (need keystoreB64, alias, password)"; exit 1; }
          echo "::add-mask::$KS_PASS"
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          test -s "$KS" || { echo "ERROR: decoded shared keystore is empty"; exit 1; }
          EXPECTED_FP="$(keytool -list -v -keystore "$KS" -storepass "$KS_PASS" | awk -F': ' '/SHA256:/ {print $2; exit}')"
          test -n "$EXPECTED_FP" || { echo "ERROR: could not read the shared keystore certificate fingerprint"; exit 1; }
          for ABI in arm64 armeabi; do
            SRC="unsigned-phone/Aurum-Customer-$ABI.apk"
            DST="signed/Aurum-Customer-$ABI.apk"
            test -s "$SRC" || { echo "ERROR: missing unsigned APK $SRC"; exit 1; }
            "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" --out "$DST" "$SRC"
            "$APKSIGNER" verify --verbose "$DST"
            verify_fp "$DST" "$EXPECTED_FP" "the shared keystore" || exit 1
            echo "Signed + verified $DST"
          done
          SRC="unsigned-master/Aurum-Master-arm64.apk"
          DST="signed/Aurum-Master-arm64.apk"
          test -s "$SRC" || { echo "ERROR: missing unsigned Master APK $SRC"; exit 1; }
          "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" --out "$DST" "$SRC"
          "$APKSIGNER" verify --verbose "$DST"
          verify_fp "$DST" "$EXPECTED_FP" "the shared keystore" || exit 1
          echo "Signed + verified $DST (Master, same shared key)"
          cp "$WORK/devices.txt" signed/devices.txt
          printf '%s' "$SHARED_DEVICE_ID" > signed/master_device.txt
          rm -f "$WORK"/shared.p12 "$WORK"/shared.json
          (cd signed && sha256sum Aurum-*.apk > SHA256SUMS.txt)
          ls -l signed/
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-signed
          path: signed/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish direct phone download
    needs: [sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Ajay's current phone — only this device's update record carries the Master APK URL. (Same id as the sign job's shared key.)
      AJAY_DEVICE_ID: 1f6aa766edbf
    steps:
      - uses: actions/download-artifact@v4
        with: { name: aurum-signed, path: signed }
      - name: Create prerelease and download links
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          TAG: phone-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export BASE="$SERVER/$REPO/releases/download/$TAG"
          test -s signed/SHA256SUMS.txt
          ls signed/Aurum-*.apk
          gh release create "$TAG" signed/Aurum-*.apk signed/SHA256SUMS.txt \
            --repo "$REPO" --target "$SHA" --prerelease \
            --title "Aurum · Android phone preview #$GITHUB_RUN_NUMBER" \
            --notes "Phone preview. One Customer APK for all shops, signed with one shared key — the same file installs on every shop's phone. Customer app: Aurum-Customer-arm64.apk (latest phones) or Aurum-Customer-armeabi.apk (older/medium phones). Master app (developer only, one APK): Aurum-Master-arm64.apk. The x86_64 split is built for the emulator test only and is not published. Sample data resets on reload. No production account or signing secret is included. Each shop's APK installs over 1.0.48/1.0.49 without uninstalling; older builds still need one uninstall first. Updates stay staged until Ajay taps Sabko update bhejo in the Master app."
          {
            echo '## Your phone builds are ready'
            echo ''
            echo "**[⬇ Customer arm64 (all shops)]($BASE/Aurum-Customer-arm64.apk) · [⬇ Customer armeabi (all shops)]($BASE/Aurum-Customer-armeabi.apk)**"
            if [ -s signed/master_device.txt ]; then
              echo "**[⬇ Download master APK (Ajay only, arm64)]($BASE/Aurum-Master-arm64.apk)**"
            fi
            echo ''
            echo 'फोन पर लिंक टैप करें → डाउनलोड हुई APK खोलें → Android की अनुमति देखकर Install दबाएँ।'
            echo ''
            echo 'Demo only. A workflow cannot silently download, install or launch an app on your phone.'
          } >> "$GITHUB_STEP_SUMMARY"
      # OPEN CONTRACT POINT (masterArm64Url for non-Ajay devices): the
      # Worker validates update records and requires non-empty https
      # URLs, so an empty masterArm64Url string would fail validation.
      # This job therefore OMITS masterArm64Url from the payload for
      # devices without a Master build — the Worker must accept a
      # missing masterArm64Url for those devices. Only Ajay's device record carries the Master
      # asset URL — the Master app only runs on his phone.
      - name: Register updates on license server (allowed=false)
        env:
          ADMIN_TOKEN: ${{ secrets.VITE_LICENSE_ADMIN_TOKEN }}
          TAG: phone-${{ github.run_id }}-${{ github.run_attempt }}
          VERSION: 1.0.${{ github.run_number }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export BASE="$SERVER/$REPO/releases/download/$TAG"
          while read -r DEVICE; do
            [ -n "$DEVICE" ] || continue
            MASTER_URL=""
            if [ "$DEVICE" = "$AJAY_DEVICE_ID" ] && [ -s signed/master_device.txt ]; then
              MASTER_URL="$BASE/Aurum-Master-arm64.apk"
            fi
            if [ -z "$MASTER_URL" ]; then
              echo "NOTE: no Master APK for device $DEVICE - masterArm64Url is omitted from its update record (Worker must accept a missing masterArm64Url; see the workflow comment above this step)."
            fi
            PAYLOAD="$(MASTER_URL="$MASTER_URL" python3 -c 'import json,os
          p={"version": os.environ["VERSION"], "customerArm64Url": os.environ["BASE"] + "/Aurum-Customer-arm64.apk", "customerArmeabiUrl": os.environ["BASE"] + "/Aurum-Customer-armeabi.apk", "allowed": False, "mandatory": False}
          m=os.environ.get("MASTER_URL") or ""
          if m:
              p["masterArm64Url"]=m
          print(json.dumps(p))')"
            echo "Registering update $VERSION for device $DEVICE (allowed=false)..."
            OK=0
            for attempt in 1 2 3; do
              if curl -fsSL -X POST "https://aurum-license-server.gahrwala.workers.dev/admin/updates/$DEVICE" \
                  -H "Authorization: Bearer $ADMIN_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$PAYLOAD"; then
                echo "Update registered for $DEVICE (attempt $attempt)."
                OK=1
                break
              fi
              echo "Update POST for $DEVICE failed (attempt $attempt/3); retrying in 10s..."
              sleep 10
            done
            if [ "$OK" != "1" ]; then
              echo "ERROR: could not register update $VERSION for device $DEVICE after 3 attempts - in-app updates depend on this record."
              exit 1
            fi
          done < signed/devices.txt
          echo "All update records registered (allowed=false - Ajay pushes to all from the Master app)."

  device:
    name: Android system Back and print dialog (API 35)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: aurum-phone-preview, path: phone }
      - run: npm ci
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Check hosted Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Sign the emulator APK with a throwaway key (emulator test only)
        run: |
          set -euo pipefail
          # The apk job now ships UNSIGNED APKs (shared-key signing
          # happens in the sign job), and adb cannot install an unsigned
          # APK. Sign the x86_64 split here with a throwaway key that
          # exists only on this runner and is never published or reused.
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-test.p12" -storetype PKCS12 -alias emulator-test -keyalg RSA -keysize 2048 -validity 30 -storepass emulator-test -keypass emulator-test -dname "CN=Aurum emulator test"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator-test.p12" --ks-pass pass:emulator-test --ks-key-alias emulator-test --key-pass pass:emulator-test --out phone/Aurum-Customer-x86_64-signed.apk phone/Aurum-Customer-x86_64.apk
          mv phone/Aurum-Customer-x86_64-signed.apk phone/Aurum-Customer-x86_64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose phone/Aurum-Customer-x86_64.apk
      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/android/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-print-dialogs, path: test-results/phone/, retention-days: 14 }
